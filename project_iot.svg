  <text x="30" y="52" font-family="Fira Code, Consolas, monospace" font-size="21" font-weight="700" fill="#f5f5f5">🧹 IoT Garbage Monitoring</text>
  <text x="30" y="86" font-family="Fira Code, Consolas, monospace" font-size="13" font-weight="400" fill="#a8a8a8">
    <tspan x="30" dy="0">Smart city solution using methane</tspan>
    <tspan x="30" dy="19">detection, LoRaWAN communication, and</tspan>
    <tspan x="30" dy="19">ML-based pickup prediction.</tspan>
  </text>
