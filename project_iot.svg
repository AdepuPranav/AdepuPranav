<svg width="430" height="260" viewBox="0 0 430 260" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="bgp3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#020202"/>
    </linearGradient>
    <radialGradient id="blobAp3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#b0b0b0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#b0b0b0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobBp3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d8d8d8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#d8d8d8" stop-opacity="0"/>
    </radialGradient>
    <filter id="blurp3" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <filter id="edgeglowp3" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <linearGradient id="glassp3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.025"/>
    </linearGradient>
    <linearGradient id="edgegradp3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.18"/>
    </linearGradient>
    <clipPath id="clipp3">
      <rect x="0" y="0" width="430" height="260" rx="22"/>
    </clipPath>
  </defs>
  <g clip-path="url(#clipp3)">
    <rect width="430" height="260" fill="url(#bgp3)"/>
    <circle cx="90" cy="50" r="95" fill="url(#blobAp3)" filter="url(#blurp3)"/>
    <circle cx="350" cy="210" r="105" fill="url(#blobBp3)" filter="url(#blurp3)"/>
    <rect width="430" height="260" fill="url(#glassp3)"/>
  </g>
  <rect x="2" y="2" width="426" height="256" rx="21" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="3" filter="url(#edgeglowp3)"/>
