  <rect x="86" y="159" width="39" height="26" rx="13.0" fill="#ffffff" fill-opacity="0.07" stroke="#c8c8c8" stroke-opacity="0.55" stroke-width="1"/>
  <text x="105.5" y="176.0" font-family="Fira Code, Consolas, monospace" font-size="11" fill="#c8c8c8" text-anchor="middle">ML</text>
  <rect x="135" y="159" width="73" height="26" rx="13.0" fill="#ffffff" fill-opacity="0.07" stroke="#909090" stroke-opacity="0.55" stroke-width="1"/>
  <text x="171.5" y="176.0" font-family="Fira Code, Consolas, monospace" font-size="11" fill="#909090" text-anchor="middle">LoRaWAN</text>
  <rect x="218" y="159" width="107" height="26" rx="13.0" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1"/>
  <text x="271.5" y="176.0" font-family="Fira Code, Consolas, monospace" font-size="11" fill="#ffffff" text-anchor="middle">Edge Compute</text>
