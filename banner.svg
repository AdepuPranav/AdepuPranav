<svg width="900" height="230" viewBox="0 0 900 230" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="bgbanner" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#020202"/>
    </linearGradient>
    <radialGradient id="blobAbanner" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobBbanner" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#b0b0b0" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#b0b0b0" stop-opacity="0"/>
    </radialGradient>
    <filter id="blurbanner" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <filter id="edgeglowbanner" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <linearGradient id="glassbanner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.025"/>
    </linearGradient>
    <linearGradient id="edgegradbanner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.18"/>
    </linearGradient>
    <clipPath id="clipbanner">
      <rect x="0" y="0" width="900" height="230" rx="22"/>
    </clipPath>
  </defs>
  <g clip-path="url(#clipbanner)">
    <rect width="900" height="230" fill="url(#bgbanner)"/>
    <circle cx="150" cy="60" r="150" fill="url(#blobAbanner)" filter="url(#blurbanner)"/>
    <circle cx="760" cy="180" r="170" fill="url(#blobBbanner)" filter="url(#blurbanner)"/>
    <rect width="900" height="230" fill="url(#glassbanner)"/>
  </g>
  <rect x="2" y="2" width="896" height="226" rx="21" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="3" filter="url(#edgeglowbanner)"/>
  <rect x="1" y="1" width="898" height="228" rx="22" fill="none" stroke="url(#edgegradbanner)" stroke-width="1.4"/>
  <text x="450" y="90" font-family="Fira Code, Consolas, monospace" font-size="34" font-weight="700" fill="#f5f5f5" text-anchor="middle">Adepu Pranav</text>
  <text x="450" y="122" font-family="Fira Code, Consolas, monospace" font-size="16" fill="#ffffff" text-anchor="middle">.NET &#8226; Game Dev &#8226; AI</text>
  <text x="450" y="155" font-family="Fira Code, Consolas, monospace" font-size="13" fill="#a8a8a8" text-anchor="middle">Building intelligent systems, immersive games, and real-world tech.</text>
</svg>