<svg width="430" height="260" viewBox="0 0 430 260" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="bgp1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#020202"/>
    </linearGradient>
    <radialGradient id="blobAp1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobBp1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d8d8d8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#d8d8d8" stop-opacity="0"/>
    </radialGradient>
    <filter id="blurp1" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <filter id="edgeglowp1" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <linearGradient id="glassp1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.025"/>
    </linearGradient>
    <linearGradient id="edgegradp1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.18"/>
    </linearGradient>
    <clipPath id="clipp1">
      <rect x="0" y="0" width="430" height="260" rx="22"/>
    </clipPath>
  </defs>
  <g clip-path="url(#clipp1)">
    <rect width="430" height="260" fill="url(#bgp1)"/>
    <circle cx="90" cy="50" r="95" fill="url(#blobAp1)" filter="url(#blurp1)"/>
    <circle cx="350" cy="210" r="105" fill="url(#blobBp1)" filter="url(#blurp1)"/>
    <rect width="430" height="260" fill="url(#glassp1)"/>
  </g>
  <rect x="2" y="2" width="426" height="256" rx="21" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="3" filter="url(#edgeglowp1)"/>
  <rect x="1" y="1" width="428" height="258" rx="22" fill="none" stroke="url(#edgegradp1)" stroke-width="1.4"/>
  <text x="30" y="52" font-family="Fira Code, Consolas, monospace" font-size="21" font-weight="700" fill="#f5f5f5">🎮 3D Tank Destroyer</text>
  <text x="30" y="86" font-family="Fira Code, Consolas, monospace" font-size="13" font-weight="400" fill="#a8a8a8">
    <tspan x="30" dy="0">Endless procedural Unity game with</tspan>
    <tspan x="30" dy="19">combat mechanics, zombie AI, scoring</tspan>
    <tspan x="30" dy="19">system, and health-based gameplay.</tspan>
  </text>
  <rect x="30" y="159" width="60" height="26" rx="13.0" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1"/>
  <text x="60.0" y="176.0" font-family="Fira Code, Consolas, monospace" font-size="11" fill="#ffffff" text-anchor="middle">Unity</text>
  <rect x="100" y="159" width="39" height="26" rx="13.0" fill="#ffffff" fill-opacity="0.07" stroke="#c8c8c8" stroke-opacity="0.55" stroke-width="1"/>
  <text x="119.5" y="176.0" font-family="Fira Code, Consolas, monospace" font-size="11" fill="#c8c8c8" text-anchor="middle">C#</text>
  <rect x="149" y="159" width="73" height="26" rx="13.0" fill="#ffffff" fill-opacity="0.07" stroke="#909090" stroke-opacity="0.55" stroke-width="1"/>
  <text x="185.5" y="176.0" font-family="Fira Code, Consolas, monospace" font-size="11" fill="#909090" text-anchor="middle">Physics</text>
  <rect x="232" y="159" width="121" height="26" rx="13.0" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1"/>
  <text x="292.5" y="176.0" font-family="Fira Code, Consolas, monospace" font-size="11" fill="#ffffff" text-anchor="middle">Procedural Gen</text>
</svg>