  <text x="52" y="114" font-family="Fira Code, Consolas, monospace" font-size="14" fill="#a8a8a8">&#8226; Passionate about Game Development, AI, and Machine Learning</text>
  <text x="52" y="144" font-family="Fira Code, Consolas, monospace" font-size="14" fill="#a8a8a8">&#8226; Building immersive experiences using Unity &amp; C#</text>
  <text x="52" y="174" font-family="Fira Code, Consolas, monospace" font-size="14" fill="#a8a8a8">&#8226; Developing AI-powered systems and automation tools</text>
  <text x="52" y="204" font-family="Fira Code, Consolas, monospace" font-size="14" fill="#a8a8a8">&#8226; .NET enthusiast focused on scalable backend systems</text>
