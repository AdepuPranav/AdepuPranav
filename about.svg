<svg width="900" height="300" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="bgabout" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#020202"/>
    </linearGradient>
    <radialGradient id="blobAabout" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d8d8d8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#d8d8d8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobBabout" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blurabout" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <filter id="edgeglowabout" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <linearGradient id="glassabout" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.025"/>
    </linearGradient>
    <linearGradient id="edgegradabout" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.18"/>
    </linearGradient>
    <clipPath id="clipabout">
      <rect x="0" y="0" width="900" height="300" rx="22"/>
    </clipPath>
  </defs>
  <g clip-path="url(#clipabout)">
    <rect width="900" height="300" fill="url(#bgabout)"/>
    <circle cx="120" cy="60" r="140" fill="url(#blobAabout)" filter="url(#blurabout)"/>
    <circle cx="780" cy="240" r="150" fill="url(#blobBabout)" filter="url(#blurabout)"/>
    <rect width="900" height="300" fill="url(#glassabout)"/>
  </g>
  <rect x="2" y="2" width="896" height="296" rx="21" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="3" filter="url(#edgeglowabout)"/>
  <rect x="1" y="1" width="898" height="298" rx="22" fill="none" stroke="url(#edgegradabout)" stroke-width="1.4"/>
