<svg width="430" height="260" viewBox="0 0 430 260" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="bgp4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#020202"/>
    </linearGradient>
    <radialGradient id="blobAp4" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobBp4" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#b0b0b0" stop-opacity="0.45"/>
